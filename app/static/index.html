<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SharePoint File Fetcher (Local)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1e293b; }
  h1 { font-size: 20px; }
  section { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  section.disabled { opacity: 0.4; pointer-events: none; }
  input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; margin: 6px 0; font-size: 14px; }
  button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  ul { font-size: 13px; max-height: 240px; overflow-y: auto; padding-left: 18px; }
  .status { font-size: 12px; color: #64748b; margin-top: 4px; }
  .warn { color: #b45309; }
</style>
</head>
<body>
  <h1>SharePoint File Fetcher (Local)</h1>

  <section id="step-status">
    <h3>1. ログイン状態の確認</h3>
    <button onclick="checkStatus()">確認する</button>
    <div class="status" id="statusMsg"></div>
  </section>

  <section id="step-explore" class="disabled">
    <h3>2. ファイル構造を探索</h3>
    <button onclick="doExplore('auto')">探索する(キャッシュがあれば使用)</button>
    <button onclick="doExplore('full')">全体を再探索</button>
    <div class="status" id="exploreStatus"></div>
    <hr style="margin:12px 0; border-color:#e2e8f0;">
    <div style="font-size:13px; color:#64748b;">特定フォルダだけ再探索(サーバー相対URL)</div>
    <input id="subfolderPath" placeholder="/sites/FMU-examDB-m333/共有ドキュメント/過去問&授業資料">
    <button onclick="doExploreSubfolder()">このフォルダだけ再探索</button>
  </section>

  <section id="step-select" class="disabled">
    <h3>3. 取得したいファイルの指示</h3>
    <textarea id="instruction" rows="3" placeholder="例: 2026年度の見積書のExcelファイルだけ"></textarea>
    <button onclick="doSelect()">選定する</button>
    <ul id="selectedList"></ul>
  </section>

  <section id="step-download" class="disabled">
    <h3>4. ダウンロード</h3>
    <button onclick="doDownload()">選定ファイルをZIPで取得</button>
  </section>

<script src="/static/app.js"></script>
</body>
</html>
